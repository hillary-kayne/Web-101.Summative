<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — ReThread</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .auth-card { width: 100%; max-width: 380px; padding: 36px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 24px; }
  .tab-btn {
    flex: 1;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 8px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--denim-500);
  }
  .tab-btn.active { background: var(--denim-900); color: #fff; border-color: var(--denim-900); }
  form.hidden { display: none; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <a href="/" class="brand" style="display:block; margin-bottom:20px;">Re<span class="stitch">Thread</span></a>
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Log in</button>
      <button class="tab-btn" data-tab="signup">Sign up</button>
    </div>

    <div id="form-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;">Log in</button>
    </form>

    <form id="signup-form" class="hidden">
      <div class="field">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" minlength="3" maxlength="50" required>
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" minlength="6" required>
        <p class="muted" style="font-size:0.78rem; margin-top:4px;">At least 6 characters.</p>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%;">Create account</button>
    </form>

    <p class="center muted" style="font-size:0.85rem; margin-top:18px;">
      <a href="/locator.html">Just here for the locator? No login needed →</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  const tabs = document.querySelectorAll(".tab-btn");
  const loginForm = document.getElementById("login-form");
  const signupForm = document.getElementById("signup-form");
  const errorBox = document.getElementById("form-error");

  tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
      tabs.forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      errorBox.innerHTML = "";
      if (tab.dataset.tab === "login") {
        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");
      } else {
        signupForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
      }
    });
  });

  if (Auth.isLoggedIn()) window.location.href = "/log.html";

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.innerHTML = "";
    try {
      const res = await Api.login(
        document.getElementById("login-username").value.trim(),
        document.getElementById("login-password").value
      );
      Auth.setSession(res.token, res.username);
      window.location.href = "/log.html";
    } catch (err) {
      errorBox.innerHTML = `<div class="banner banner-warn">${escapeHtml(err.message)}</div>`;
    }
  });

  signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.innerHTML = "";
    try {
      const res = await Api.signup(
        document.getElementById("signup-username").value.trim(),
        document.getElementById("signup-password").value
      );
      Auth.setSession(res.token, res.username);
      window.location.href = "/log.html";
    } catch (err) {
      errorBox.innerHTML = `<div class="banner banner-warn">${escapeHtml(err.message)}</div>`;
    }
  });
</script>
</body>
</html>

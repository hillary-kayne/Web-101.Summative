# lb-01 — round-robin across web-01 and web-02, with active /healthz checks.
# HAProxy (open-source) does native active health checks, which plain
# open-source nginx doesn't — that's why this is HAProxy instead of nginx.
# Install: apt install haproxy, then drop this in /etc/haproxy/haproxy.cfg

global
    log /dev/log local0
    maxconn 2048
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend rethread_front
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/www.hillaryco.tech.pem
    default_backend rethread_back

backend rethread_back
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server web-01 10.227.50.192:8000 check inter 5s fall 3 rise 2
    server web-02 10.227.102.34:8000 check inter 5s fall 3 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
